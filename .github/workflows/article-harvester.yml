name: Article harvest

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  skill:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Run Claude Skill akiba-article-harvester
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: "--dangerously-skip-permissions"
          prompt: |
            Read the file:
            .claude/skills/akiba-article-harvester/SKILL.md
            Execute all instructions in that skill.
            Do not merely explain what the skill says.
            Actually perform the work described by the skill.

      - name: Commit and push data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add .
          if git diff --cached --quiet; then
            echo "No changes detected, skipping push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update article $(date +%Y-%m-%dT%H)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy workflow
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
