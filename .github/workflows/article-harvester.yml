name: Article harvest

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  skill:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Skill akiba-article-harvester
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the file:
            .claude/skills/akiba-article-harvester/SKILL.md
            Execute all instructions in that skill.
            Do not merely explain what the skill says.
            Actually perform the work described by the skill.

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes detected, skipping push"
          else
            git commit -m "Update article $(date +%Y-%m-%dT%H)"
            git push
          fi
